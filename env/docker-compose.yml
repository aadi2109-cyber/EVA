version: "3.8"

services:
  ui:
    build:
      context: ../agent/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: agent/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - GUARD_SERVICE_URL=http://guard:8100
    volumes:
      - ../workspace:/app/workspace
      - ../agent.db:/app/agent.db
    depends_on:
      - guard

  guard:
    build:
      context: ../guard
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    env_file:
      - .env.example
    environment:
      - GUARD_DATABASE_URL=sqlite:///./guard.db
    volumes:
      - ../guard.db:/app/guard.db
