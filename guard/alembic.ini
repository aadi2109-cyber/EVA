[alembic]
script_location = %(here)s/alembic
# URL is resolved in alembic/env.py from GUARD_DB_PATH (default ./guard.db); override with -x url=sqlite:///path
sqlalchemy.url =

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
