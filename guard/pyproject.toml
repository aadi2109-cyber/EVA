[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva-guard"
version = "0.1.0"
description = "EVA Guard - modular security system for AI agent execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
]

[tool.hatch.build.targets.wheel]
packages = ["eva_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
