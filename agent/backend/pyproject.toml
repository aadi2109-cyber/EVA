[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva-agent-backend"
version = "0.1.0"
description = "EVA Agent Backend - orchestrator, tools, connectors, and guard client"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    # imported by the in-process guard (eva_guard) that the backend loads
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../../contracts", "../../guard", "../.."]
asyncio_mode = "auto"
