[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva-contracts"
version = "0.1.0"
description = "Frozen API contracts and schemas for EVA Agent and Guard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["eva_contracts"]
